name: Ratio Trigger Probe
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  probe:
    if: github.event.issue.title == '[probe] actions'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --body "actions-probe: SUCCESS"
