name: Ratio Workbook Verify

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratio-workbook-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full repository verification
        run: npm run verify

      - name: Upload verified preview artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ratio-workbook-verify-${{ github.run_id }}
          path: |
            preview/full-workbook.html
            preview/full-workbook-artifact.html
            preview/graphics-inventory-source.json
            preview/audit/audit.json
            preview/audit/graphics-golden-candidate.json
            preview/audit/ratio-workbook-preview.pdf
            preview/audit/pages/*.png
            preview/audit/graphics/*.png
            preview/audit/grayscale/*.png
            content-manifest.json
          if-no-files-found: warn
          retention-days: 14
