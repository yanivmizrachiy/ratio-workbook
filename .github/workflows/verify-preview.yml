name: Ratio Workbook Verify

on:
  push:
    branches:
      - agent/ratio-textbook-reorder-20260819
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratio-workbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core source, type, tests, sequence and manifest verification
        run: npm run quality:check && npm run manifest:write
      - name: Canonical Jerusalem artwork gate
        run: npm run assets:verify
      - run: npx playwright install --with-deps chromium
      - name: Build and verify complete A4 preview
        run: npm run preview:build && npm run preview:verify && npm run graphics:invariants
      - name: Upload complete preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratio-workbook-preview-${{ github.run_number }}
          path: |
            preview/full-workbook.html
            preview/full-workbook-artifact.html
            preview/graphics-inventory-source.json
            preview/audit/audit.json
            preview/audit/graphics-golden-candidate.json
            preview/audit/ratio-workbook-preview.pdf
            preview/audit/pages/*.png
            preview/audit/graphics/*.png
            preview/audit/grayscale/*.png
            content-manifest.json
          if-no-files-found: warn
          retention-days: 30
