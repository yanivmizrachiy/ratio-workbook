name: Ratio Workbook Verify

on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ratio-workbook-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Full repository verification
        run: npm run verify

      - name: Upload verified preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratio-workbook-verify-${{ github.run_id }}
          path: |
            preview/full-workbook.html
            preview/full-workbook-artifact.html
            preview/graphics-inventory-source.json
            preview/audit/audit.json
            preview/audit/graphics-golden-candidate.json
            preview/audit/ratio-workbook-preview.pdf
            preview/audit/pages/*.png
            preview/audit/graphics/*.png
            preview/audit/grayscale/*.png
            content-manifest.json
          if-no-files-found: warn
          retention-days: 14
