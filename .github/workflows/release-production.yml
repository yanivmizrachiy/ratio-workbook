name: Ratio Workbook Production Release

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH to release the already-merged main commit'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ratio-workbook-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify source before release
        run: npm run verify

      - name: Restore tracked source after verification
        run: git reset --hard HEAD

      - name: Materialize verified production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s preview/full-workbook.html
          test -s preview/audit/ratio-workbook-preview.pdf
          cp preview/full-workbook.html workbook.html
          cp preview/audit/ratio-workbook-preview.pdf ratio-workbook.pdf
          node scripts/fix-public-reader.mjs
          test -s site-shell.html
          cp site-shell.html index.html

      - name: Production preflight
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s workbook.html
          test -s ratio-workbook.pdf
          grep -Fq "dataset.workbookReady='true'" workbook.html
          grep -Fq 'wb-page worksheet-page' workbook.html
          grep -Fq 'src="./workbook.html"' index.html
          grep -Fq 'href="./ratio-workbook.pdf"' index.html
          grep -Fq "querySelectorAll('.wb-page')" index.html
          ! grep -Fq 'לא נמצאו דפים' index.html
          ! grep -Fqi 'demo' index.html

      - name: Prevent stale-main release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "${GITHUB_SHA}"

      - name: Commit verified generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html workbook.html ratio-workbook.pdf site-shell.html
          if git diff --cached --quiet; then
            echo 'Production artifacts already match the verified main source.'
            exit 0
          fi
          git commit -m "release: publish verified ratio workbook ${GITHUB_SHA::12}"
          git push origin HEAD:main
