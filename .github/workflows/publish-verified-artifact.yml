name: Publish verified ratio artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-verified-artifact.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download exact verified artifact 131
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ratio-artifact
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9442746812/zip > /tmp/ratio-artifact.zip
          unzip -q /tmp/ratio-artifact.zip -d /tmp/ratio-artifact
          test -f /tmp/ratio-artifact/preview/full-workbook.html
          echo '7c2a2e8cc39ebc0eef2754d22789cd8b2266582c470afac14cf75440c314040d  /tmp/ratio-artifact/preview/full-workbook.html' | sha256sum -c -
      - name: Publish only the verified workbook HTML
        run: |
          set -euo pipefail
          cp /tmp/ratio-artifact/preview/full-workbook.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Production already matches verified artifact.'
            exit 0
          fi
          git commit -m 'publish: verified ratio workbook artifact 131'
          git push origin HEAD:main
