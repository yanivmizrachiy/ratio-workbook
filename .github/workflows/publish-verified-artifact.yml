name: Publish verified ratio artifact

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-verified-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download exact verified artifact 141
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/ratio-artifact
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9449168605/zip > /tmp/ratio-artifact.zip
          unzip -q /tmp/ratio-artifact.zip -d /tmp/ratio-artifact
          test -f /tmp/ratio-artifact/preview/full-workbook.html
          echo '508448c8641fdeaa55964134e7e0d1661251226fa608aef625152ad9bd02d605  /tmp/ratio-artifact/preview/full-workbook.html' | sha256sum -c -
          grep -q "page.setAttribute('data-front-page',String(i+1))" /tmp/ratio-artifact/preview/full-workbook.html
          grep -q 'wb-front-page' /tmp/ratio-artifact/preview/full-workbook.html
          grep -q '<bdi dir="ltr">2 : 1</bdi>' /tmp/ratio-artifact/preview/full-workbook.html

      - name: Publish only the verified workbook HTML
        run: |
          set -euo pipefail
          cp /tmp/ratio-artifact/preview/full-workbook.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Production already matches verified artifact 141.'
            exit 0
          fi
          git commit -m 'publish: verified ratio workbook artifact 141 with RTL ratio fix'
          git push origin HEAD:main
