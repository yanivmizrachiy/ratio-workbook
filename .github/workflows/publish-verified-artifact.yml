name: Publish verified ratio production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-verified-artifact.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and verify current workbook
        run: npm run verify

      - name: Require the two approved front pages
        run: |
          set -euo pipefail
          test -f preview/full-workbook.html
          grep -q 'data-front-page="1"' preview/full-workbook.html
          grep -q 'data-front-page="2"' preview/full-workbook.html
          test "$(grep -o 'data-front-page="[12]"' preview/full-workbook.html | wc -l)" -eq 2
          grep -q 'wb-front-page' preview/full-workbook.html
          echo 'Approved color cover and second opening page are present.'

      - name: Publish only the fully verified workbook HTML
        run: |
          set -euo pipefail
          cp preview/full-workbook.html index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Production already matches the verified current build.'
            exit 0
          fi
          git commit -m 'publish: restore verified color cover and opening pages'
          git push origin HEAD:main

