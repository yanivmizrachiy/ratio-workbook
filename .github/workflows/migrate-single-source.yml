name: Finalize Ratio Single Source

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratio-finalize-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/single-source-migration-20260819' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/single-source-migration-20260819
          fetch-depth: 0

      - name: Guard public artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "78ef58f617096586feefc9af96f649f39435ac07"
          echo "Public index.html is frozen."

      - name: Fetch reviewed migration source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/razpages-source"
          git clone --depth 1 --branch agent/ratio-preview-hardening-20260819 https://github.com/yanivmizrachiy/razpages.git "$RUNNER_TEMP/razpages-source"
          test -d "$RUNNER_TEMP/razpages-source/sources/lovable/ratio-workbook"

      - name: Create minimal standalone ratio source
        shell: bash
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/razpages-source/sources/lovable/ratio-workbook"
          rm -rf src scripts vendor preview dist node_modules public sources
          rm -f bun.lock bun.lockb COMPLIANCE-PLAN.md PARABULA-INTEGRATION.md components.json eslint.config.js package-lock.json
          mkdir -p src/components/worksheet/pages src/components/worksheet/corrected src/data src/lib src/test scripts vendor/fonts/rubik .github/workflows
          for f in Chapter1Pages.tsx Chapter2Pages.tsx Chapter3Pages.tsx Chapter4Pages.tsx Chapter6Pages.tsx Chapter7Pages.tsx PageLayout.tsx; do cp "$OLD/src/components/worksheet/pages/$f" src/components/worksheet/pages/; done
          for f in RatioPage01.tsx Chapter1Corrections.tsx Chapter2Corrections.tsx Chapter3Corrections.tsx Chapter4Corrections.tsx Chapter5Corrections.tsx Chapter6Corrections.tsx Chapter7Corrections.tsx CurriculumQuestionsPages.tsx; do cp "$OLD/src/components/worksheet/corrected/$f" src/components/worksheet/corrected/; done
          cp "$OLD/src/data/worksheetPages.tsx" src/data/
          cp "$OLD/src/lib/utils.ts" "$OLD/src/lib/ratioMath.ts" src/lib/
          for f in pageClass.test.tsx printHeader.test.tsx ratioMath.test.ts workbookStructure.test.tsx; do cp "$OLD/src/test/$f" src/test/; done
          for f in index.css curriculum-pages.css ratio-v2.css ratio-layout-fixes.css ratio-canonical-fit.css vite-env.d.ts; do cp "$OLD/src/$f" src/; done
          for f in _build-full-workbook.mjs generate-content-manifest.mjs verify-full-workbook.mjs; do cp "$OLD/scripts/$f" scripts/; done
          cp "$RUNNER_TEMP/razpages-source/vendor/fonts/rubik.css" vendor/fonts/
          cp "$RUNNER_TEMP/razpages-source/vendor/fonts/rubik/"*.woff2 vendor/fonts/rubik/
          rm -f src/components/worksheet/corrected/TeacherIntroPages.tsx src/teacher-intro-pages.css

      - name: Normalize source, print pipeline and source-of-truth metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/data/worksheetPages.tsx'); s=p.read_text(); s=s.replace(' * מקור האמת לחוברת התלמיד.', ' * אינדקס המימוש הקנוני של דפי התלמיד. הדרישות המחייבות נמצאות רק ב-SOURCE_OF_TRUTH.md.'); p.write_text(s)
          p=Path('src/index.css'); s=p.read_text(); s='\n'.join(line for line in s.splitlines() if 'fonts.googleapis.com' not in line) + '\n'; p.write_text(s)
          p=Path('src/ratio-canonical-fit.css'); s=p.read_text().replace('The opening teacher\n   sequence is not affected.', 'Teacher-only pages are not part of the student workbook.'); p.write_text(s)
          p=Path('scripts/generate-content-manifest.mjs'); s=p.read_text().replace("sourceOfTruth: 'src/data/worksheetPages.tsx',", "requirementsSourceOfTruth: 'SOURCE_OF_TRUTH.md',\n    implementationIndex: 'src/data/worksheetPages.tsx',"); p.write_text(s)
          p=Path('src/test/workbookStructure.test.tsx'); s=p.read_text().replace("it('contains exactly 55 student pages with stable keys and sequential display numbers', () => {\n    expect(WORKSHEET_PAGES).toHaveLength(55);", "it('contains student pages with stable keys and sequential display numbers', () => {\n    expect(WORKSHEET_PAGES.length).toBeGreaterThan(0);"); p.write_text(s)
          p=Path('scripts/_build-full-workbook.mjs'); s=p.read_text(); s=s.replace("const repoRoot = path.resolve(projectRoot, '..', '..', '..');", "const repoRoot = projectRoot;"); s=s.replace(".wb-page{box-shadow:none!important;page-break-after:always;page-break-inside:avoid}", ".wb-page{zoom:1!important;box-shadow:none!important;page-break-after:always;page-break-inside:avoid}"); p.write_text(s)
          p=Path('scripts/verify-full-workbook.mjs'); s=p.read_text(); needle="await page.emulateMedia({ media: 'print' });\n"; insert="""await page.setViewportSize({ width: 390, height: 844 });\nawait page.emulateMedia({ media: 'screen' });\nawait page.evaluate(() => window.dispatchEvent(new Event('resize')));\nawait page.waitForTimeout(50);\nawait page.emulateMedia({ media: 'print' });\nconst printMetrics = await page.locator('.wb-page').evaluateAll((nodes) => nodes.map((node,index) => { const rect=node.getBoundingClientRect(); return {page:index+1,width:rect.width,height:rect.height,zoom:getComputedStyle(node).zoom||'1'}; }));\nfor (const metric of printMetrics) { if (Math.abs(metric.width-793.7)>3) failures.push(`Print page ${metric.page}: A4 width drift after narrow viewport (${metric.width}px).`); if (Math.abs(metric.height-1122.5)>4) failures.push(`Print page ${metric.page}: A4 height drift after narrow viewport (${metric.height}px).`); if(metric.zoom!=='1'&&metric.zoom!=='normal') failures.push(`Print page ${metric.page}: zoom is ${metric.zoom}, expected 1.`); }\n"""; assert needle in s; p.write_text(s.replace(needle,insert,1))
          PY

      - name: Write simple editing workbench
        shell: bash
        run: |
          cat > src/App.tsx <<'EOF'
          import { useMemo, useState } from 'react';
          import { WORKSHEET_PAGES } from '@/data/worksheetPages';
          import { PageNumberScope } from '@/components/worksheet/pages/PageLayout';
          const ZOOMS=[50,67,75,90,100,110,125] as const;
          export default function App(){const[index,setIndex]=useState(0);const[zoom,setZoom]=useState<number>(90);const page=WORKSHEET_PAGES[index];const pages=useMemo(()=>WORKSHEET_PAGES.map((item,i)=>({...item,index:i})),[]);return <div className="ratio-editor-shell" dir="rtl"><aside className="ratio-editor-sidebar no-print"><div className="ratio-editor-title"><strong>יחס ופרופורציה</strong><span>{WORKSHEET_PAGES.length} דפי תלמיד</span></div><div className="ratio-editor-actions"><button onClick={()=>window.print()}>הדפסה</button><label>תצוגה <select value={zoom} onChange={e=>setZoom(Number(e.target.value))}>{ZOOMS.map(v=><option key={v} value={v}>{v}%</option>)}</select></label></div><nav className="ratio-editor-pages">{pages.map(item=><button key={item.key} className={item.index===index?'is-active':''} onClick={()=>setIndex(item.index)}><b>{item.id}</b><span>{item.title}</span></button>)}</nav></aside><main className="ratio-editor-preview"><div className="ratio-editor-toolbar no-print"><button disabled={index===0} onClick={()=>setIndex(v=>Math.max(0,v-1))}>הקודם</button><span>עמוד {page.id} מתוך {WORKSHEET_PAGES.length}</span><button disabled={index===WORKSHEET_PAGES.length-1} onClick={()=>setIndex(v=>Math.min(WORKSHEET_PAGES.length-1,v+1))}>הבא</button></div><div className="ratio-editor-canvas"><div className="ratio-editor-page-scale" style={{zoom:zoom/100}}><PageNumberScope pageNumber={page.id}>{page.component()}</PageNumberScope></div></div></main><div className="ratio-print-all print-only">{WORKSHEET_PAGES.map(item=><PageNumberScope key={item.key} pageNumber={item.id}>{item.component()}</PageNumberScope>)}</div></div>}
          EOF
          cat > src/main.tsx <<'EOF'
          import{createRoot}from'react-dom/client';import App from'./App';import'./index.css';import'./curriculum-pages.css';import'./ratio-v2.css';import'./ratio-layout-fixes.css';import'./ratio-canonical-fit.css';import'./workbench.css';createRoot(document.getElementById('root')!).render(<App/>);
          EOF
          cat > src/workbench.css <<'EOF'
          .ratio-editor-shell{min-height:100vh;background:#eef2f7;display:grid;grid-template-columns:minmax(0,1fr) 310px;direction:ltr}.ratio-editor-sidebar{grid-column:2;direction:rtl;background:#fff;border-right:1px solid #dbe3ee;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;overflow:hidden}.ratio-editor-title{padding:16px 18px;border-bottom:1px solid #e5eaf1;display:flex;flex-direction:column;gap:3px;color:#1f2a44}.ratio-editor-title span{font-size:12px;color:#64748b}.ratio-editor-actions{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid #e5eaf1}.ratio-editor-actions button,.ratio-editor-actions select,.ratio-editor-toolbar button{font:inherit;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 10px;color:#1f2a44}.ratio-editor-pages{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:4px}.ratio-editor-pages button{border:0;background:transparent;border-radius:8px;padding:8px 9px;text-align:right;display:grid;grid-template-columns:26px 1fr;gap:6px;align-items:start;font:inherit;color:#334155}.ratio-editor-pages button.is-active{background:#e8eef8}.ratio-editor-pages b{width:24px;height:24px;border-radius:999px;background:#1f2a44;color:#fff;display:grid;place-items:center;font-size:11px}.ratio-editor-pages span{font-size:12px;line-height:1.35;padding-top:3px}.ratio-editor-preview{grid-column:1;grid-row:1;direction:rtl;min-width:0}.ratio-editor-toolbar{height:48px;background:#fff;border-bottom:1px solid #dbe3ee;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:14px}.ratio-editor-canvas{padding:24px;display:flex;justify-content:center;align-items:flex-start;overflow:auto;min-height:calc(100vh - 48px)}.print-only{display:none}@media(max-width:900px){.ratio-editor-shell{display:block}.ratio-editor-sidebar{position:static;height:auto;max-height:38vh}.ratio-editor-canvas{padding:8px}}@media print{.no-print{display:none!important}.ratio-editor-page-scale{display:none!important}.print-only{display:block!important}.print-only .worksheet-page{zoom:1!important;box-shadow:none!important;page-break-after:always;page-break-inside:avoid}.print-only .worksheet-page:last-child{page-break-after:auto}}
          EOF
          cat > workbench.html <<'EOF'
          <!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>יחס ופרופורציה — סביבת עריכה</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
          EOF

      - name: Write deterministic minimal toolchain
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {"name":"ratio-workbook","private":true,"version":"1.0.0","type":"module","scripts":{"dev":"vite --open /workbench.html","build":"vite build","typecheck":"tsc --noEmit -p tsconfig.app.json","test":"vitest run","source:check":"node scripts/check-source-of-truth.mjs","manifest:check":"node scripts/generate-content-manifest.mjs","manifest:write":"node scripts/generate-content-manifest.mjs --write","quality:check":"npm run source:check && npm run typecheck && npm test && npm run manifest:check","preview:build":"npm run build && node scripts/_build-full-workbook.mjs preview/full-workbook.html","preview:verify":"node scripts/verify-full-workbook.mjs preview/full-workbook.html preview/audit","verify":"npm run quality:check && npm run manifest:write && npm run preview:build && npm run preview:verify"},"dependencies":{"clsx":"2.1.1","react":"18.3.1","react-dom":"18.3.1","tailwind-merge":"2.6.0"},"devDependencies":{"@types/node":"22.16.5","@types/react":"18.3.23","@types/react-dom":"18.3.7","@vitejs/plugin-react-swc":"3.11.0","autoprefixer":"10.4.21","playwright":"1.61.1","postcss":"8.5.6","tailwindcss":"3.4.17","typescript":"5.8.3","vite":"5.4.19","vitest":"3.2.4"}}
          EOF
          cat > vite.config.ts <<'EOF'
          import{defineConfig}from'vite';import react from'@vitejs/plugin-react-swc';import path from'node:path';import{fileURLToPath}from'node:url';const root=path.dirname(fileURLToPath(import.meta.url));export default defineConfig({plugins:[react()],resolve:{alias:{'@':path.resolve(root,'src')}},build:{rollupOptions:{input:path.resolve(root,'workbench.html')}}});
          EOF
          cat > vitest.config.ts <<'EOF'
          import{defineConfig}from'vitest/config';import path from'node:path';import{fileURLToPath}from'node:url';const root=path.dirname(fileURLToPath(import.meta.url));export default defineConfig({resolve:{alias:{'@':path.resolve(root,'src')}},test:{environment:'node',globals:true}});
          EOF
          cat > tailwind.config.ts <<'EOF'
          import type{Config}from'tailwindcss';export default{content:['./workbench.html','./src/**/*.{ts,tsx}'],theme:{extend:{colors:{border:'hsl(var(--border))',background:'hsl(var(--background))',foreground:'hsl(var(--foreground))',card:{DEFAULT:'hsl(var(--card))',foreground:'hsl(var(--card-foreground))'},primary:{DEFAULT:'hsl(var(--primary))',foreground:'hsl(var(--primary-foreground))'},secondary:{DEFAULT:'hsl(var(--secondary))',foreground:'hsl(var(--secondary-foreground))'},muted:{DEFAULT:'hsl(var(--muted))',foreground:'hsl(var(--muted-foreground))'},accent:{DEFAULT:'hsl(var(--accent))',foreground:'hsl(var(--accent-foreground))'}}}},plugins:[]} satisfies Config;
          EOF
          echo "export default {plugins:{tailwindcss:{},autoprefixer:{}}};" > postcss.config.js
          cat > tsconfig.json <<'EOF'
          {"files":[],"references":[{"path":"./tsconfig.app.json"},{"path":"./tsconfig.node.json"}]}
          EOF
          cat > tsconfig.app.json <<'EOF'
          {"compilerOptions":{"target":"ES2020","useDefineForClassFields":true,"lib":["ES2020","DOM","DOM.Iterable"],"module":"ESNext","skipLibCheck":true,"moduleResolution":"Bundler","allowImportingTsExtensions":true,"resolveJsonModule":true,"isolatedModules":true,"noEmit":true,"jsx":"react-jsx","strict":true,"baseUrl":".","paths":{"@/*":["./src/*"]},"types":["vitest/globals"]},"include":["src"]}
          EOF
          cat > tsconfig.node.json <<'EOF'
          {"compilerOptions":{"target":"ES2022","lib":["ES2023"],"module":"ESNext","skipLibCheck":true,"moduleResolution":"Bundler","allowImportingTsExtensions":true,"isolatedModules":true,"moduleDetection":"force","noEmit":true,"strict":true},"include":["vite.config.ts","vitest.config.ts"]}
          EOF
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          preview/
          content-manifest.json
          *.log
          .DS_Store
          EOF

      - name: Write one authoritative requirements file and guard
        shell: bash
        run: |
          cat > README.md <<'EOF'
          # חוברת יחס ופרופורציה — כיתה ח׳

          זהו הריפו הקנוני היחיד. כל הדרישות והכללים נמצאים רק ב־[`SOURCE_OF_TRUTH.md`](./SOURCE_OF_TRUTH.md).

          `npm ci` → `npm run dev` לעריכה. `npm run verify` לבדיקה מלאה. `index.html` הוא ה־Production המאושר ואינו מוחלף בלי אישור יניב.
          EOF
          cat > SOURCE_OF_TRUTH.md <<'EOF'
          # יחס ופרופורציה — מקור האמת היחיד

          מסמך זה הוא הסמכות היחידה לכל דרישה בפרויקט יחס. כל דרישה חדשה של יניב נרשמת כאן לפני שינוי בקוד; לפני כל שינוי קוראים אותו; סתירה מוצגת ליניב לפני מימוש. בכל עבודה ארוכה מדווחים אחוז התקדמות אמיתי ואחוז שנותר.

          ## ריפו וזרימת עבודה
          - הריפו הקנוני היחיד: `yanivmizrachiy/ratio-workbook`.
          - אין `sources/` ואין מקור פיתוח אחר. כל הקוד, CSS, פונטים, build, tests ו-Preview נמצאים כאן בלבד.
          - `index.html` הוא Production שכבר נשלח למורים ונשאר קפוא בזמן פיתוח. `workbench.html` הוא סביבת העריכה.
          - Preview אינו מחליף Production. אין פרסום בלי Preview מלא ואישור מפורש של יניב.

          ## חוברת תלמיד
          - 0 דפי מורה; החוברת מתחילה בעמוד 1; אין `יחס · למורה` ואין עמודים לא ממוספרים לפניו.
          - בסיס ההגירה: 55 דפי תלמיד סמנטיים, עם `key` יציב ומספור רציף הנגזר מהסדר.

          ## תוכן, עיצוב וגרפיקה
          - לא ממציאים שאלות/נתונים/תשובות. שינוי מתמטי דורש אימות. דיוק מתמטי קודם לעיצוב.
          - RTL כברירת מחדל; LTR נקודתי למתמטיקה/SVG. כפל `·`; סעיפים `א.` `ב.` `ג.`.
          - המוצר הסופי A4. לא מקטינים כתב או דוחסים שאלה; מפצלים בצורה מבוקרת.
          - שרטוטים וגרפים חדשים הם SVG וקטורי מדויק ככל האפשר. אקצנט `#1f2a44` עד שינוי מפורש.
          - מרחבי תשובה מותאמים לסוג התשובה: יחס `▭ : ▭`, זוג סדור `( ▭ , ▭ )`, חישוב/הסבר עם שטח מתאים, בחירה בלי תיבה מיותרת.

          ## טכנולוגיה וקלות עריכה
          - React + TypeScript strict, Vite, SVG, Playwright+Chromium, CSS Print A4, פונטים מקומיים, SHA-256 ו-CI חוסם regression.
          - npm + `package-lock.json` יחיד; אין נתיבים מוחלטים ואין תלות בריפו אחר.
          - שינויים רוחביים נעשים ברכיבים/design tokens. `src/data/worksheetPages.tsx` הוא אינדקס מימוש בלבד, לא מקור דרישות. generated artifacts אינם נערכים ידנית.

          ## בדיקות חובה
          - source-of-truth guard, TypeScript, unit/structure/math tests, keys ומספור, 0 דפי מורה, build נקי, manifest/hash.
          - Chromium לכל הדפים, A4 width/height, 0 overflow, 0 SVG מחוץ לדף, 0 console/page errors, 0 בקשות רשת, screenshots, PDF ובדיקת Print אחרי viewport צר.
          - Baseline מאומת: 55 דפים סמנטיים, 70 דפי A4 פיזיים, 0 דפי מורה, 0 overflow, 0 שגיאות דפדפן ו-0 בקשות רשת.
          EOF
          cat > scripts/check-source-of-truth.mjs <<'EOF'
          import fs from'node:fs';import path from'node:path';const root=process.cwd();for(const f of['SOURCE_OF_TRUTH.md','README.md','src/data/worksheetPages.tsx'])if(!fs.existsSync(path.join(root,f)))throw new Error(`Missing ${f}`);for(const f of['COMPLIANCE-PLAN.md','PARABULA-INTEGRATION.md','bun.lock','bun.lockb','src/teacher-intro-pages.css','src/components/worksheet/corrected/TeacherIntroPages.tsx'])if(fs.existsSync(path.join(root,f)))throw new Error(`Forbidden ${f}`);if(fs.existsSync(path.join(root,'sources')))throw new Error('sources/ is forbidden');const r=fs.readFileSync('README.md','utf8');if(!r.includes('SOURCE_OF_TRUTH.md')||r.length>2200)throw new Error('README must only point to SOURCE_OF_TRUTH.md');const m=fs.readFileSync('scripts/generate-content-manifest.mjs','utf8');if(!m.includes("requirementsSourceOfTruth: 'SOURCE_OF_TRUTH.md'"))throw new Error('Manifest source-of-truth metadata missing');console.log('Single source-of-truth guard passed.');
          EOF
          cat > .github/workflows/verify-preview.yml <<'EOF'
          name: Ratio Single Source Verify
          on: [workflow_dispatch]
          permissions: {contents: read}
          jobs:
            verify:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with: {node-version: 22, cache: npm}
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - run: npm run verify
          EOF

      - name: Generate exactly one lockfile and verify
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run verify

      - name: Enforce exact migration baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "78ef58f617096586feefc9af96f649f39435ac07"
          test ! -d sources
          test ! -e src/components/worksheet/corrected/TeacherIntroPages.tsx
          test ! -e src/teacher-intro-pages.css
          test ! -e bun.lock
          test ! -e bun.lockb
          node - <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('preview/audit/audit.json','utf8'));if(a.status!=='pass'||a.semanticPages!==55||a.physicalPages!==70||a.teacherPages!==0||a.firstStudentPage!==1||a.externalRequests.length||a.consoleErrors.length||a.pageErrors.length)throw new Error(JSON.stringify(a,null,2));console.log(JSON.stringify({status:a.status,semanticPages:a.semanticPages,physicalPages:a.physicalPages,teacherPages:a.teacherPages,contentSha256:a.contentSha256},null,2));
          NODE

      - name: Remove one-time migration workflow and commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-single-source.yml
          git config user.name "Ratio Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A ':!preview' ':!dist'
          git commit -m "[single-source] יחס: מקור עצמאי יחיד מאומת"
          git push origin HEAD:agent/single-source-migration-20260819

      - name: Upload full Preview for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ratio-single-source-preview-${{ github.run_number }}
          path: |
            preview/full-workbook.html
            preview/audit/audit.json
            preview/audit/ratio-workbook-preview.pdf
            preview/audit/pages/*.png
            content-manifest.json
          if-no-files-found: warn
