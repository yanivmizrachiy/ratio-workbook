name: Deep Math Audit Fix

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deep-math-audit-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deep-math-audit-2026-10-04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - name: Apply deterministic mathematical corrections
        run: python scripts/run-deep-math-audit-fixes.py
      - name: Regenerate locked content baseline from corrected source
        run: node scripts/regenerate-content-baseline.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Full verification
        run: npm run verify
      - name: Commit verified corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_OF_TRUTH.md src scripts/apply-deep-math-audit-fixes.py scripts/run-deep-math-audit-fixes.py scripts/regenerate-content-baseline.mjs
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'fix(math): correct audited workbook errors and SSOT [math-audit-applied]'
          git push origin HEAD:fix/deep-math-audit-2026-10-04
