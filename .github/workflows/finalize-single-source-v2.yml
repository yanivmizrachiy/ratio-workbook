name: Finalize Ratio Single Source V2

on:
  push:
    branches: [agent/single-source-migration-20260819]
    paths: ['.github/workflows/finalize-single-source-v2.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratio-finalize-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/single-source-migration-20260819
          fetch-depth: 0

      - name: Freeze public production artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "78ef58f617096586feefc9af96f649f39435ac07"

      - name: Fetch verified migration source once
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch agent/ratio-preview-hardening-20260819 https://github.com/yanivmizrachiy/razpages.git "$RUNNER_TEMP/ratio-old"
          OLD="$RUNNER_TEMP/ratio-old/sources/lovable/ratio-workbook"
          test -d "$OLD"

          rm -rf src scripts vendor preview dist node_modules public sources
          rm -f package.json package-lock.json bun.lock bun.lockb COMPLIANCE-PLAN.md PARABULA-INTEGRATION.md components.json eslint.config.js postcss.config.js tailwind.config.ts tsconfig.json tsconfig.app.json tsconfig.node.json vite.config.ts vitest.config.ts workbench.html
          mkdir -p src/components/worksheet/pages src/components/worksheet/corrected src/data src/lib src/test scripts vendor/fonts/rubik .github/workflows

          for f in Chapter1Pages.tsx Chapter2Pages.tsx Chapter3Pages.tsx Chapter4Pages.tsx Chapter6Pages.tsx Chapter7Pages.tsx PageLayout.tsx; do cp "$OLD/src/components/worksheet/pages/$f" src/components/worksheet/pages/; done
          for f in RatioPage01.tsx Chapter1Corrections.tsx Chapter2Corrections.tsx Chapter3Corrections.tsx Chapter4Corrections.tsx Chapter5Corrections.tsx Chapter6Corrections.tsx Chapter7Corrections.tsx CurriculumQuestionsPages.tsx; do cp "$OLD/src/components/worksheet/corrected/$f" src/components/worksheet/corrected/; done
          cp "$OLD/src/data/worksheetPages.tsx" src/data/
          cp "$OLD/src/lib/utils.ts" "$OLD/src/lib/ratioMath.ts" src/lib/
          for f in pageClass.test.tsx printHeader.test.tsx ratioMath.test.ts workbookStructure.test.tsx; do cp "$OLD/src/test/$f" src/test/; done
          for f in index.css curriculum-pages.css ratio-v2.css ratio-layout-fixes.css ratio-canonical-fit.css vite-env.d.ts; do cp "$OLD/src/$f" src/; done
          for f in _build-full-workbook.mjs generate-content-manifest.mjs verify-full-workbook.mjs; do cp "$OLD/scripts/$f" scripts/; done
          cp "$RUNNER_TEMP/ratio-old/vendor/fonts/rubik.css" vendor/fonts/
          cp "$RUNNER_TEMP/ratio-old/vendor/fonts/rubik/"*.woff2 vendor/fonts/rubik/

      - name: Normalize self-contained source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/data/worksheetPages.tsx')
          s=p.read_text(encoding='utf-8').replace(' * מקור האמת לחוברת התלמיד.', ' * אינדקס המימוש הקנוני של דפי התלמיד. הדרישות המחייבות נמצאות רק ב-SOURCE_OF_TRUTH.md.')
          p.write_text(s,encoding='utf-8')

          p=Path('src/index.css')
          s='\n'.join(line for line in p.read_text(encoding='utf-8').splitlines() if 'fonts.googleapis.com' not in line)+'\n'
          p.write_text(s,encoding='utf-8')

          p=Path('src/ratio-canonical-fit.css')
          p.write_text(p.read_text(encoding='utf-8').replace('The opening teacher\n   sequence is not affected.', 'Teacher-only pages are not part of the student workbook.'),encoding='utf-8')

          p=Path('scripts/generate-content-manifest.mjs')
          p.write_text(p.read_text(encoding='utf-8').replace("sourceOfTruth: 'src/data/worksheetPages.tsx',", "requirementsSourceOfTruth: 'SOURCE_OF_TRUTH.md',\n    implementationIndex: 'src/data/worksheetPages.tsx',"),encoding='utf-8')

          p=Path('src/test/workbookStructure.test.tsx')
          p.write_text(p.read_text(encoding='utf-8').replace("it('contains exactly 55 student pages with stable keys and sequential display numbers', () => {\n    expect(WORKSHEET_PAGES).toHaveLength(55);", "it('contains student pages with stable keys and sequential display numbers', () => {\n    expect(WORKSHEET_PAGES.length).toBeGreaterThan(0);"),encoding='utf-8')

          p=Path('scripts/_build-full-workbook.mjs')
          s=p.read_text(encoding='utf-8').replace("const repoRoot = path.resolve(projectRoot, '..', '..', '..');", "const repoRoot = projectRoot;")
          s=s.replace(".wb-page{box-shadow:none!important;page-break-after:always;page-break-inside:avoid}", ".wb-page{zoom:1!important;box-shadow:none!important;page-break-after:always;page-break-inside:avoid}")
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/verify-full-workbook.mjs')
          s=p.read_text(encoding='utf-8')
          needle="await page.emulateMedia({ media: 'print' });\n"
          insert="""await page.setViewportSize({ width: 390, height: 844 });
          await page.emulateMedia({ media: 'screen' });
          await page.evaluate(() => window.dispatchEvent(new Event('resize')));
          await page.waitForTimeout(50);
          await page.emulateMedia({ media: 'print' });
          const printMetrics = await page.locator('.wb-page').evaluateAll((nodes) => nodes.map((node,index) => { const rect=node.getBoundingClientRect(); return {page:index+1,width:rect.width,height:rect.height,zoom:getComputedStyle(node).zoom||'1'}; }));
          for (const metric of printMetrics) { if (Math.abs(metric.width-793.7)>3) failures.push(`Print page ${metric.page}: A4 width drift after narrow viewport (${metric.width}px).`); if (Math.abs(metric.height-1122.5)>4) failures.push(`Print page ${metric.page}: A4 height drift after narrow viewport (${metric.height}px).`); if(metric.zoom!=='1'&&metric.zoom!=='normal') failures.push(`Print page ${metric.page}: zoom is ${metric.zoom}, expected 1.`); }
          """
          if needle not in s: raise SystemExit('print verification hook not found')
          p.write_text(s.replace(needle,insert,1),encoding='utf-8')
          PY

      - name: Create compact editing workbench
        shell: bash
        run: |
          cat > src/App.tsx <<'EOF'
          import {useMemo,useState} from 'react';
          import {WORKSHEET_PAGES} from '@/data/worksheetPages';
          import {PageNumberScope} from '@/components/worksheet/pages/PageLayout';
          const ZOOMS=[50,67,75,90,100,110,125] as const;
          export default function App(){const[index,setIndex]=useState(0);const[zoom,setZoom]=useState<number>(90);const page=WORKSHEET_PAGES[index];const pages=useMemo(()=>WORKSHEET_PAGES.map((item,i)=>({...item,index:i})),[]);return <div className="ratio-editor-shell" dir="rtl"><aside className="ratio-editor-sidebar no-print"><header><strong>יחס ופרופורציה</strong><span>{WORKSHEET_PAGES.length} דפי תלמיד</span></header><div className="ratio-editor-actions"><button onClick={()=>window.print()}>הדפסה</button><label>תצוגה <select value={zoom} onChange={e=>setZoom(Number(e.target.value))}>{ZOOMS.map(v=><option key={v} value={v}>{v}%</option>)}</select></label></div><nav>{pages.map(item=><button key={item.key} className={item.index===index?'is-active':''} onClick={()=>setIndex(item.index)}><b>{item.id}</b><span>{item.title}</span></button>)}</nav></aside><main className="ratio-editor-preview"><div className="ratio-editor-toolbar no-print"><button disabled={index===0} onClick={()=>setIndex(v=>Math.max(0,v-1))}>הקודם</button><span>עמוד {page.id} מתוך {WORKSHEET_PAGES.length}</span><button disabled={index===WORKSHEET_PAGES.length-1} onClick={()=>setIndex(v=>Math.min(WORKSHEET_PAGES.length-1,v+1))}>הבא</button></div><div className="ratio-editor-canvas"><div style={{zoom:zoom/100}}><PageNumberScope pageNumber={page.id}>{page.component()}</PageNumberScope></div></div></main><div className="print-only">{WORKSHEET_PAGES.map(item=><PageNumberScope key={item.key} pageNumber={item.id}>{item.component()}</PageNumberScope>)}</div></div>}
          EOF
          cat > src/main.tsx <<'EOF'
          import{createRoot}from'react-dom/client';import App from'./App';import'./index.css';import'./curriculum-pages.css';import'./ratio-v2.css';import'./ratio-layout-fixes.css';import'./ratio-canonical-fit.css';import'./workbench.css';createRoot(document.getElementById('root')!).render(<App/>);
          EOF
          cat > src/workbench.css <<'EOF'
          .ratio-editor-shell{min-height:100vh;background:#eef2f7;display:grid;grid-template-columns:minmax(0,1fr) 300px;direction:ltr}.ratio-editor-sidebar{grid-column:2;direction:rtl;background:#fff;height:100vh;position:sticky;top:0;display:flex;flex-direction:column;overflow:hidden;border-right:1px solid #dbe3ee}.ratio-editor-sidebar header{padding:16px;display:flex;flex-direction:column;color:#1f2a44;border-bottom:1px solid #e5eaf1}.ratio-editor-sidebar header span{font-size:12px;color:#64748b}.ratio-editor-actions{padding:10px;display:flex;gap:8px;border-bottom:1px solid #e5eaf1}.ratio-editor-actions button,.ratio-editor-actions select,.ratio-editor-toolbar button{font:inherit;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:7px 10px}.ratio-editor-sidebar nav{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:3px}.ratio-editor-sidebar nav button{border:0;background:transparent;border-radius:8px;padding:7px;text-align:right;display:grid;grid-template-columns:26px 1fr;gap:6px}.ratio-editor-sidebar nav button.is-active{background:#e8eef8}.ratio-editor-sidebar nav b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#1f2a44;color:white;font-size:11px}.ratio-editor-preview{grid-column:1;grid-row:1;direction:rtl}.ratio-editor-toolbar{height:48px;background:white;border-bottom:1px solid #dbe3ee;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:14px}.ratio-editor-canvas{padding:24px;display:flex;justify-content:center;overflow:auto}.print-only{display:none}@media(max-width:900px){.ratio-editor-shell{display:block}.ratio-editor-sidebar{position:static;height:auto;max-height:38vh}.ratio-editor-canvas{padding:8px}}@media print{.no-print{display:none!important}.ratio-editor-canvas{display:none!important}.print-only{display:block!important}.print-only .worksheet-page{zoom:1!important;box-shadow:none!important;page-break-after:always;page-break-inside:avoid}.print-only .worksheet-page:last-child{page-break-after:auto}}
          EOF
          cat > workbench.html <<'EOF'
          <!doctype html><html lang="he" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>יחס ופרופורציה — סביבת עריכה</title></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
          EOF

      - name: Create minimal deterministic toolchain
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {"name":"ratio-workbook","private":true,"version":"1.0.0","type":"module","scripts":{"dev":"vite --open /workbench.html","build":"vite build","typecheck":"tsc --noEmit -p tsconfig.app.json","test":"vitest run","source:check":"node scripts/check-source-of-truth.mjs","manifest:check":"node scripts/generate-content-manifest.mjs","manifest:write":"node scripts/generate-content-manifest.mjs --write","quality:check":"npm run source:check && npm run typecheck && npm test && npm run manifest:check","preview:build":"npm run build && node scripts/_build-full-workbook.mjs preview/full-workbook.html","preview:verify":"node scripts/verify-full-workbook.mjs preview/full-workbook.html preview/audit","verify":"npm run quality:check && npm run manifest:write && npm run preview:build && npm run preview:verify"},"dependencies":{"clsx":"2.1.1","react":"18.3.1","react-dom":"18.3.1","tailwind-merge":"2.6.0"},"devDependencies":{"@types/node":"22.16.5","@types/react":"18.3.23","@types/react-dom":"18.3.7","@vitejs/plugin-react-swc":"3.11.0","autoprefixer":"10.4.21","playwright":"1.61.1","postcss":"8.5.6","tailwindcss":"3.4.17","typescript":"5.8.3","vite":"5.4.19","vitest":"3.2.4"}}
          EOF
          cat > vite.config.ts <<'EOF'
          import{defineConfig}from'vite';import react from'@vitejs/plugin-react-swc';import path from'node:path';import{fileURLToPath}from'node:url';const root=path.dirname(fileURLToPath(import.meta.url));export default defineConfig({plugins:[react()],resolve:{alias:{'@':path.resolve(root,'src')}},build:{rollupOptions:{input:path.resolve(root,'workbench.html')}}});
          EOF
          cat > vitest.config.ts <<'EOF'
          import{defineConfig}from'vitest/config';import path from'node:path';import{fileURLToPath}from'node:url';const root=path.dirname(fileURLToPath(import.meta.url));export default defineConfig({resolve:{alias:{'@':path.resolve(root,'src')}},test:{environment:'node',globals:true}});
          EOF
          cat > tailwind.config.ts <<'EOF'
          import type{Config}from'tailwindcss';export default{content:['./workbench.html','./src/**/*.{ts,tsx}'],theme:{extend:{colors:{border:'hsl(var(--border))',background:'hsl(var(--background))',foreground:'hsl(var(--foreground))',card:{DEFAULT:'hsl(var(--card))',foreground:'hsl(var(--card-foreground))'},primary:{DEFAULT:'hsl(var(--primary))',foreground:'hsl(var(--primary-foreground))'},secondary:{DEFAULT:'hsl(var(--secondary))',foreground:'hsl(var(--secondary-foreground))'},muted:{DEFAULT:'hsl(var(--muted))',foreground:'hsl(var(--muted-foreground))'},accent:{DEFAULT:'hsl(var(--accent))',foreground:'hsl(var(--accent-foreground))'}}}},plugins:[]} satisfies Config;
          EOF
          echo "export default {plugins:{tailwindcss:{},autoprefixer:{}}};" > postcss.config.js
          cat > tsconfig.json <<'EOF'
          {"files":[],"references":[{"path":"./tsconfig.app.json"},{"path":"./tsconfig.node.json"}]}
          EOF
          cat > tsconfig.app.json <<'EOF'
          {"compilerOptions":{"target":"ES2020","useDefineForClassFields":true,"lib":["ES2020","DOM","DOM.Iterable"],"module":"ESNext","skipLibCheck":true,"moduleResolution":"Bundler","allowImportingTsExtensions":true,"resolveJsonModule":true,"isolatedModules":true,"noEmit":true,"jsx":"react-jsx","strict":true,"baseUrl":".","paths":{"@/*":["./src/*"]},"types":["vitest/globals"]},"include":["src"]}
          EOF
          cat > tsconfig.node.json <<'EOF'
          {"compilerOptions":{"target":"ES2022","lib":["ES2023"],"module":"ESNext","skipLibCheck":true,"moduleResolution":"Bundler","allowImportingTsExtensions":true,"isolatedModules":true,"moduleDetection":"force","noEmit":true,"strict":true},"include":["vite.config.ts","vitest.config.ts"]}
          EOF
          cat > .gitignore <<'EOF'
          node_modules/
          dist/
          preview/
          content-manifest.json
          *.log
          .DS_Store
          EOF

      - name: Add single-source guard and permanent verification
        shell: bash
        run: |
          cat > scripts/check-source-of-truth.mjs <<'EOF'
          import fs from'node:fs';import path from'node:path';const root=process.cwd();for(const f of['SOURCE_OF_TRUTH.md','README.md','src/data/worksheetPages.tsx','scripts/generate-content-manifest.mjs'])if(!fs.existsSync(path.join(root,f)))throw new Error(`Missing ${f}`);for(const f of['COMPLIANCE-PLAN.md','PARABULA-INTEGRATION.md','bun.lock','bun.lockb','src/teacher-intro-pages.css','src/components/worksheet/corrected/TeacherIntroPages.tsx'])if(fs.existsSync(path.join(root,f)))throw new Error(`Forbidden legacy file: ${f}`);if(fs.existsSync('sources'))throw new Error('sources/ is forbidden');const readme=fs.readFileSync('README.md','utf8');if(!readme.includes('SOURCE_OF_TRUTH.md')||readme.length>2200)throw new Error('README must stay a short pointer to SOURCE_OF_TRUTH.md');function walk(d){if(!fs.existsSync(d))return[];return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>{const f=path.join(d,e.name);return e.isDirectory()?walk(f):[f]})}for(const f of ['src','scripts','.github/workflows'].flatMap(walk)){if(path.basename(f)==='check-source-of-truth.mjs')continue;if(!/\.(?:[cm]?[jt]sx?|css|ya?ml|json)$/.test(f))continue;const t=fs.readFileSync(f,'utf8');for(const x of ['sources/lovable/ratio-workbook','yanivmizrachiy/razpages'])if(t.includes(x))throw new Error(`Legacy dependency in ${f}`)}const m=fs.readFileSync('scripts/generate-content-manifest.mjs','utf8');if(!m.includes("requirementsSourceOfTruth: 'SOURCE_OF_TRUTH.md'"))throw new Error('Manifest source metadata missing');console.log('Single source-of-truth guard passed.');
          EOF
          cat > .github/workflows/verify-preview.yml <<'EOF'
          name: Ratio Single Source Verify
          on:
            push:
              branches: [agent/single-source-migration-20260819]
            pull_request:
              branches: [main]
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 45
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with: {node-version: 22, cache: npm}
                - run: npm ci
                - run: npx playwright install --with-deps chromium
                - run: npm run verify
                - if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: ratio-preview-${{ github.run_number }}
                    path: |
                      preview/full-workbook.html
                      preview/audit/audit.json
                      preview/audit/ratio-workbook-preview.pdf
                      preview/audit/pages/*.png
                      content-manifest.json
                    if-no-files-found: warn
                    retention-days: 30
          EOF

      - name: Verify exact standalone workbook
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          rm -rf node_modules
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run verify
          test "$(git hash-object index.html)" = "78ef58f617096586feefc9af96f649f39435ac07"
          test ! -d sources
          test ! -e src/components/worksheet/corrected/TeacherIntroPages.tsx
          test ! -e bun.lock
          test ! -e bun.lockb
          node - <<'NODE'
          const fs=require('fs');const a=JSON.parse(fs.readFileSync('preview/audit/audit.json','utf8'));if(a.status!=='pass'||a.semanticPages!==55||a.physicalPages!==70||a.teacherPages!==0||a.firstStudentPage!==1||a.externalRequests.length||a.consoleErrors.length||a.pageErrors.length)throw new Error(JSON.stringify(a,null,2));console.log({status:a.status,semanticPages:a.semanticPages,physicalPages:a.physicalPages,teacherPages:a.teacherPages,hash:a.contentSha256});
          NODE

      - name: Commit only verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-single-source-v2.yml
          git config user.name "Ratio Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "[single-source] יחס: מקור עצמאי יחיד מאומת"
          git push origin HEAD:agent/single-source-migration-20260819
