name: Publish integrated ratio site on deploy branch

on:
  push:
    branches:
      - deploy/ratio-integrated-site

permissions:
  contents: write

concurrency:
  group: ratio-integrated-production
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out production main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update source of truth first
        run: |
          node scripts/ensure-integrated-site-sot.mjs
          node scripts/ensure-static-reader-sot.mjs
          node scripts/ensure-ratio-header-sot.mjs

      - name: Persist source of truth before code
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add SOURCE_OF_TRUTH.md
          if ! git diff --cached --quiet; then
            git commit -m 'docs: require real static workbook pages in public reader'
            git push origin HEAD:main
          fi

      - name: Keep approved Zaviyot logo local
        shell: bash
        run: |
          set -euo pipefail
          test -s logo.png
          python3 - <<'PY'
          from pathlib import Path
          data = Path('logo.png').read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n', 'logo.png is not a PNG'
          assert len(data) > 100_000, 'logo.png is unexpectedly small'
          print(f'logo.png verified: {len(data)} bytes')
          PY

      - name: Build public reader from verified static workbook contract
        shell: bash
        run: |
          set -euo pipefail
          test -s site-shell.html
          test -s workbook.html
          test -s ratio-workbook.pdf
          grep -Fq "dataset.workbookReady='true'" workbook.html
          grep -Fq "wb-page worksheet-page" workbook.html
          node scripts/fix-public-reader.mjs
          cp site-shell.html index.html

      - name: Verify real-page reader before publish
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'tszRqqH13Dw' index.html
          grep -Fq 'src="./workbook.html"' index.html
          grep -Fq 'src="./logo.png"' index.html
          grep -Fq 'logo-spin 20s linear infinite' index.html
          grep -Fq 'עמוד הבית' index.html
          grep -Fq 'סרטון המחשה' index.html
          grep -Fq 'דפים להדפסה' index.html
          grep -Fq 'הורדת PDF' index.html
          grep -Fq 'href="./ratio-workbook.pdf"' index.html
          grep -Fq "dataset.workbookReady" index.html
          grep -Fq "querySelectorAll('.wb-page')" index.html
          grep -Fq 'ratio-reader-current' index.html
          grep -Fq 'כשל פרסום' SOURCE_OF_TRUTH.md
          ! grep -Fq 'ratio-editor-sidebar nav button' index.html
          ! grep -Fq 'לא נמצאו דפים' index.html
          ! grep -Fq 'דף A4 אחד בכל פעם, מותאם למסך' index.html
          ! grep -Fq 'הדפים עצמם נשמרים כפי שפורסמו' index.html
          ! grep -Fq 'חוברת דיגיטלית' index.html

      - name: Commit production state
        shell: bash
        run: |
          set -euo pipefail
          git add SOURCE_OF_TRUTH.md index.html site-shell.html logo.png scripts/ensure-integrated-site-sot.mjs scripts/ensure-static-reader-sot.mjs scripts/fix-public-reader.mjs scripts/ensure-ratio-header-sot.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'publish: show verified workbook pages in public reader'
            git push origin HEAD:main
          fi
